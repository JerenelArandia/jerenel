<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | School IT Repair Portal</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <header>
    <div class="admin-nav">
      <div class="admin-logo">🛡️ School IT <span>Admin Portal</span></div>
    </div>
  </header>

  <main class="login-wrapper">
    <div class="login-card">
      <h2>Staff Authentication</h2>
      <p>Log in to manage computer repair bookings</p>

      <div id="error-alert" class="alert-message alert-danger"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter admin username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; School IT Department Repair Activity. Confidential Admin Panel.</p>
  </footer>

  <script src="/admin/js/login.js"></script>
</body>
</html>
