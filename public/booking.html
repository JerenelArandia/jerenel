<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Repair | School IT Repair Shop</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="/" class="logo">💻 School IT <span>Repair Hub</span></a>
      <ul class="nav-links">
        <li><a href="/">Services</a></li>
        <li><a href="/booking.html" class="active">Book Appointment</a></li>
        <li><a href="/confirmation.html">Check Status</a></li>
      </ul>
    </div>
  </header>

  <main>
    <div class="form-container">
      <h2 style="margin-bottom: 0.5rem; color: var(--accent-blue);">Schedule Your Repair</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Select your service and choose a convenient date and time.</p>

      <form id="booking-form">
        <div class="form-group">
          <label for="service_id">Repair Service *</label>
          <select id="service_id" name="service_id" required>
            <option value="">-- Select Service --</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="booking_date">Appointment Date *</label>
            <input type="date" id="booking_date" name="booking_date" required>
          </div>
          <div class="form-group">
            <label for="booking_time">Appointment Time *</label>
            <input type="time" id="booking_time" name="booking_time" required>
          </div>
        </div>

        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" placeholder="e.g. Juan dela Cruz" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">School Email *</label>
            <input type="email" id="email" name="email" placeholder="student@school.edu.ph" required>
          </div>
          <div class="form-group">
            <label for="contact">Contact / Mobile Number *</label>
            <input type="tel" id="contact" name="contact" placeholder="09171234567" required>
          </div>
        </div>

        <div class="form-group">
          <label for="guests">Number of Devices / Visitors</label>
          <input type="number" id="guests" name="guests" min="1" max="5" value="1">
        </div>

        <div class="form-group">
          <label for="notes">Issue Details / Additional Notes</label>
          <textarea id="notes" name="notes" rows="3" placeholder="Describe the problem with your device..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Confirm & Submit Booking</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; School IT Department Repair Activity. All prices listed in Philippine Pesos (₱).</p>
  </footer>

  <script src="/js/booking.js"></script>
</body>
</html>
